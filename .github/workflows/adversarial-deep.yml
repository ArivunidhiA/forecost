name: Adversarial deep run
# Weekly, unattended: 2000 fuzz examples per property. A failure prints a minimal falsifying
# example, so a regression in robustness/privacy/accounting surfaces without anyone remembering.
on:
  schedule:
    - cron: "43 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,forecast]"
      - run: pytest tests/test_adversarial.py tests/test_property_based.py -q --benchmark-disable
        env:
          FORECOST_FUZZ_EXAMPLES: "2000"
