name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check forecost/ tests/
      - run: ruff format --check forecost/ tests/
      - run: pyright
      - run: xenon forecost/ -b B -m A -a A

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,forecast]"
      - run: bandit -r forecost/ -c pyproject.toml
      - run: pip-audit

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,forecast]"
      - run: pytest tests/ -v --tb=short -x

  coverage:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # diff-cover needs origin/main history to compute the diff
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # The llm extra uses the newest wheel-tested LiteLLM compatibility band so
      # optional-adapter coverage cannot unexpectedly require a Rust toolchain.
      - run: pip install -e ".[dev,forecast,llm]"
      - run: pytest tests/ --cov=forecost --cov-report=term-missing --cov-report=xml
      - run: diff-cover coverage.xml --compare-branch=origin/main --fail-under 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [lint, security, test, coverage]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: forecost --version
        working-directory: ${{ runner.temp }}
      - run: forecost --help
        working-directory: ${{ runner.temp }}
      - run: forecost doctor
        working-directory: ${{ runner.temp }}
      - run: forecost ledger status
        working-directory: ${{ runner.temp }}
      - run: sh -n plugin/scripts/bootstrap.sh plugin/scripts/run-hook.sh
      - run: test -x plugin/scripts/bootstrap.sh && test -x plugin/scripts/run-hook.sh
      - run: echo '{}' | plugin/scripts/run-hook.sh session-start
        env:
          FORECOST_HOME: ${{ runner.temp }}/forecost-home
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/plugin-data
