name: CI
on:
  push:
    branches: [main, "recovery/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check forecost/ tests/
      - run: ruff format --check forecost/ tests/
      - run: python scripts/check_comparison_guard.py origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: pyright
      - run: mypy forecost/
      - run: xenon forecost/ -b B -m A -a A

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,forecast]"
      - run: bandit -r forecost/ -c pyproject.toml
      - run: pip-audit

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,forecast]"
      - run: pytest tests/ -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # diff-cover needs origin/main history to compute the diff
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # The llm extra uses the newest wheel-tested LiteLLM compatibility band so
      # optional-adapter coverage cannot unexpectedly require a Rust toolchain.
      - run: pip install -e ".[dev,forecast,llm]"
      - run: pytest tests/ --cov=forecost --cov-report=term-missing --cov-report=xml
      - run: diff-cover coverage.xml --compare-branch=origin/main --fail-under 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [lint, security, test, coverage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: forecost --version
        working-directory: ${{ runner.temp }}
      - run: forecost --help
        working-directory: ${{ runner.temp }}
      - run: forecost doctor
        working-directory: ${{ runner.temp }}
      - run: forecost ledger status
        working-directory: ${{ runner.temp }}
      - run: python "$GITHUB_WORKSPACE/scripts/e2e_wheel_smoke.py"
        shell: bash
        working-directory: ${{ runner.temp }}
      - run: sh -n plugin/scripts/bootstrap.sh plugin/scripts/run-hook.sh
      - run: test -x plugin/scripts/bootstrap.sh && test -x plugin/scripts/run-hook.sh
      - run: echo '{}' | plugin/scripts/run-hook.sh session-start
        env:
          FORECOST_HOME: ${{ runner.temp }}/forecost-home
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/plugin-data
