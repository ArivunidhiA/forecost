[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecost"
version = "0.3.0"
description = "Experimental local, content-minimizing evidence receipts for AI-agent runs with independent meter reconciliation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arivunidhi A" }]
keywords = ["llm", "cost", "ledger", "reconciliation", "claude-code", "agents", "anthropic", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25.0",
    "tomli>=2.0.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
forecast = ["statsmodels>=0.15.0", "numpy>=2.2.6"]
tui = ["textual>=8.2.8", "plotext>=6.1.0"]
# 1.91+ stopped shipping a compatible macOS/Python 3.12 wheel and newer
# releases currently require a Rust toolchain newer than common CI runners.
llm = ["litellm>=1.104.0,<1.105"]
# MCP 2.x removed ``mcp.server.fastmcp``, the public API used by this server.
# Keep fresh installs on the compatible major until the server is migrated.
mcp = ["mcp[cli]>=2.3.0,<3"]
all = ["forecost[forecast,tui,llm,mcp]"]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "pytest-cov",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.168.5",
    "pytest-benchmark>=5.3.0",
    "diff-cover>=10.6.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "vulture>=2.16",
    "ruff",
    "mypy",
    "statsmodels>=0.15.0",
    "numpy>=2.2.6",
    "mcp[cli]>=2.3.0,<3",
]

[project.scripts]
forecost = "forecost.cli:main"
forecost-hook = "forecost.hooks.fastpath:main"

[project.entry-points.pytest11]
forecost = "forecost.pytest_plugin"

[project.urls]
Homepage = "https://github.com/ArivunidhiA/forecost"
Changelog = "https://github.com/ArivunidhiA/forecost/blob/main/CHANGELOG.md"
Issues = "https://github.com/ArivunidhiA/forecost/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "S", "A", "C4", "DTZ", "T20", "PT"]
unfixable = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["forecost"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S311"]
"forecost/__init__.py" = ["RUF022"]
"forecost/commands/calc_cmd.py" = ["E501"]
"forecost/commands/export_cmd.py" = ["T201"]
"forecost/commands/forecast_cmd.py" = ["E501", "T201", "B904"]
"forecost/pricing.py" = ["RUF022", "UP045"]
"forecost/scope.py" = ["E501", "SIM103"]
"forecost/tracker.py" = ["RUF022", "T201", "UP035"]
"forecost/tui.py" = ["RUF012", "T201"]
"forecost/commands/init_cmd.py" = ["SIM108", "B904", "E501"]
"forecost/commands/optimize_cmd.py" = ["E501"]
"forecost/commands/serve_cmd.py" = ["S101", "T201"]
"forecost/commands/status_cmd.py" = ["B904"]
"forecost/db.py" = ["RUF022", "S110", "UP015"]
"forecost/forecaster.py" = ["E501"]
"forecost/interceptor.py" = ["RUF022", "S110", "SIM105", "UP015", "UP035"]
"tests/test_commands.py" = ["PT018"]
"tests/test_edge_cases.py" = ["PT011"]
"tests/test_property_based.py" = ["I001"]
"tests/test_serve_cmd.py" = ["S310"]
"tests/test_hooks.py" = ["S603"]
"experiments/calib/*.py" = ["T201"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
include = ["forecost", "tests", "scripts/check_release.py"]
exclude = ["scripts/test_real_sdk.py"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: marks tests as benchmark/accuracy tests",
    "slow: marks tests as slow-running",
]

[tool.mutmut]
paths_to_mutate = [
    "forecost/policy/engine.py",
    "forecost/ledger/integrity.py",
    "forecost/ledger/state_store.py",
]
also_copy = ["forecost"]
tests_dir = [
    "tests/test_policy.py",
    "tests/test_pricing_policy_confidence.py",
    "tests/test_journal_integrity.py",
    "tests/test_ledger.py",
    "tests/test_adapters_claude_code.py",
]
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:random-order"]

[tool.hatch.build.targets.wheel]
packages = ["forecost"]

[tool.hatch.build.targets.wheel.force-include]
"forecost/py.typed" = "forecost/py.typed"
"plugin" = "forecost/plugin"
