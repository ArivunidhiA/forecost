[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecost"
version = "0.2.0"
description = "Know exactly what your AI project will cost. Local-first LLM cost forecasting that learns from your usage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arivunidhi A" }]
keywords = ["llm", "cost", "forecast", "openai", "anthropic", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25.0",
    "tomli>=2.0.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
forecast = ["statsmodels>=0.14", "numpy>=1.24"]
tui = ["textual>=0.50", "plotext>=5.0"]
llm = ["litellm>=1.0"]
all = ["forecost[forecast,tui,llm]"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "pytest-benchmark>=4.0",
    "diff-cover>=7.0",
    "radon>=6.0",
    "xenon>=0.9",
    "bandit>=1.7",
    "pip-audit>=2.0",
    "pyright>=1.1",
    "vulture>=2.0",
    "ruff",
    "mypy",
    "statsmodels>=0.14",
    "numpy>=1.24",
]

[project.scripts]
forecost = "forecost.cli:main"

[project.entry-points.pytest11]
forecost = "forecost.pytest_plugin"

[project.urls]
Homepage = "https://github.com/ArivunidhiA/forecost"
Changelog = "https://github.com/ArivunidhiA/forecost/blob/main/CHANGELOG.md"
Issues = "https://github.com/ArivunidhiA/forecost/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "S", "A", "C4", "DTZ", "T20", "PT"]
unfixable = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["forecost"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S311"]
"forecost/__init__.py" = ["RUF022"]
"forecost/commands/calc_cmd.py" = ["E501"]
"forecost/commands/export_cmd.py" = ["T201"]
"forecost/commands/forecast_cmd.py" = ["E501", "T201", "B904"]
"forecost/pricing.py" = ["RUF022", "UP045"]
"forecost/scope.py" = ["E501", "SIM103"]
"forecost/tracker.py" = ["RUF022", "T201", "UP035"]
"forecost/tui.py" = ["RUF012", "T201"]
"forecost/commands/init_cmd.py" = ["SIM108", "B904", "E501"]
"forecost/commands/optimize_cmd.py" = ["E501"]
"forecost/commands/serve_cmd.py" = ["S101", "T201"]
"forecost/commands/status_cmd.py" = ["B904"]
"forecost/db.py" = ["RUF022", "S110", "UP015"]
"forecost/forecaster.py" = ["E501"]
"forecost/interceptor.py" = ["RUF022", "S110", "SIM105", "UP015", "UP035"]
"tests/test_commands.py" = ["PT018"]
"tests/test_edge_cases.py" = ["PT011"]
"tests/test_property_based.py" = ["I001"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv312"
exclude = ["scripts/test_real_sdk.py"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: marks tests as benchmark/accuracy tests",
    "slow: marks tests as slow-running",
]

[tool.mutmut]
paths_to_mutate = ["forecost/pricing.py", "forecost/forecaster.py", "forecost/tracker.py"]
tests_dir = ["tests"]
runner = ".venv312/bin/pytest tests/ -q"

[tool.hatch.build.targets.wheel]
packages = ["forecost"]

[tool.hatch.build.targets.wheel.force-include]
"forecost/py.typed" = "forecost/py.typed"
